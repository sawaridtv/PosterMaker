name: Match Poster & JSON Studio

on:
  schedule:
    - cron: '*/15 * * * *'  # প্রতি ১৫ মিনিট পর রান হবে
  workflow_dispatch:        # গিটহাব থেকে ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
    - name: 🌐 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests Pillow beautifulsoup4 pytz

    - name: 🚀 Run Master Poster & JSON Engine
      env:
        TARGET_REPO: "আপনার_টার্গেট_ইউজারনেম/টার্গেট_রিপো_নাম"  # পরিবর্তন করবেন
        TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
      run: python scripts/master_engine.py

    - name: 💾 Commit and Push Generated Posters
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"

        git add posters/ footy_posters/ matches.json || true
        git diff --quiet && git diff --staged --quiet || git commit -m "🎨 Auto-update posters and local JSON"
        git push
